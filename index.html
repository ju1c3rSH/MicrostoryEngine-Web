<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MicroStory</title>
<link rel="stylesheet" href="css/shell.css?v=1">
</head>
<body>
<div id="cabinet">
  <div id="cab-top">
    <span id="brand-dot" aria-hidden="true"></span>
    <span id="brand">MICROSTORY</span>
    <span id="sys-btns">
      <button id="pad-toggle" class="sys-btn" aria-label="切换手柄" aria-pressed="true" title="隐藏手柄">隐</button>
      <button id="mute-btn" class="sys-btn" aria-label="切换静音" title="静音">音</button>
    </span>
  </div>
  <div id="screen-bezel">
    <div id="game-wrap">
      <canvas id="screen" width="160" height="128"></canvas>
    </div>
  </div>
  <div id="cab-controls"></div>
  <p id="hint">WASD/方向键移动 &middot; Enter/Z/单击/A键确认 &middot; Esc/X/B键返回</p>
</div>

<script src="js/core/util.js"></script>
<script src="js/core/draw.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/core/persist.js"></script>
<script src="js/core/engine.js"></script>
<script src="js/core/story.js"></script>
<script src="js/core/story_store.js"></script>
<script src="js/core/input.js"></script>
<script src="js/stories.js"></script>
<script src="js/ui/screen.js"></script>
<script src="js/ui/dialog.js"></script>
<script src="js/ui/title_screen.js"></script>
<script src="js/ui/settings_screen.js"></script>
<script src="js/ui/about_screen.js"></script>
<script src="js/core/app_config.js"></script>
<script src="js/ui/game_screen.js"></script>
<script src="js/games/minigame.js"></script>
<script src="js/games/game_snake.js"></script>
<script src="js/games/game_qte.js"></script>
<script src="js/games/game_wam.js"></script>
<script src="js/games/game_memory.js"></script>
<script src="js/games/game_rhythm.js"></script>
<script src="js/games/game_fishing.js"></script>
<script src="js/games/game_fox.js"></script>
<script src="js/games/game_gomoku.js"></script>
<script src="js/games/game_othello.js"></script>
<script src="js/main.js"></script>
</body>
</html>
